<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Static AI Chatbot</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="container">
		<h1>AI Chatbot (Static Answers)</h1>
		<p class="subtitle">This chatbot simulates AI responses using predefined answers.</p>

		<section class="chat-card">
			<div id="chat-box" class="chat-box" aria-live="polite"></div>
			<form id="chat-form" class="chat-form">
				<input id="user-input" type="text" placeholder="Ask something..." autocomplete="off" required>
				<button type="submit">Send</button>
			</form>
		</section>

		<div class="hint-card">
			<p><strong>Try:</strong> hello, who are you, help, docker, volumes, bye</p>
		</div>
	</main>

	<script src="script.js"></script>
</body>
</html>
